# SPDX-License-Identifier: GPL-3.0-or-later
name: Nawaf Cloud Gaming - PS4 PKG

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nawaf-ps4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ps4:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            clang clang-18 lld lld-18 llvm llvm-18 \
            python3 curl wget git nasm pkg-config \
            libssl-dev zlib1g-dev unzip file

      - name: Restore source from uploaded ZIP if needed
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f CMakeLists.txt ]; then
            archive="$(find . -maxdepth 2 -type f \
              -name 'Nawaf-Cloud-Gaming-PS4-*.zip' -print -quit)"

            if [ -z "$archive" ]; then
              echo "::error::Project source ZIP is missing."
              exit 1
            fi

            mkdir -p _source
            unzip -q "$archive" -d _source

            project_root="$(find _source -mindepth 1 -maxdepth 3 \
              -type f -name CMakeLists.txt -print -quit | xargs -r dirname)"

            if [ -z "$project_root" ] || [ ! -f "$project_root/tools/ps4/package.sh" ]; then
              echo "::error::Invalid PS4 source ZIP."
              exit 1
            fi

            cp -a "$project_root"/. .
          fi

          test -f CMakeLists.txt
          test -f tools/ps4/package.sh
          test -f tools/ps4/fetch-toolchain.sh
          test -f cmake/ps4.toolchain.cmake
          test -f ps4/patches/libdatachannel.patch
          test -f ps4/patches/libjuice.patch

      - name: Read project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^project(xcloud_ps5 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ -z "$version" ]; then
            echo "::error::Could not read project version."
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag must match v$version."
            exit 1
          fi

      - name: Fetch pinned dependency sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p deps

          rm -rf deps/mbedtls
          git clone --depth 1 --branch v3.6.2 --recurse-submodules \
            --shallow-submodules https://github.com/Mbed-TLS/mbedtls.git deps/mbedtls

          rm -rf deps/libdatachannel
          git clone --depth 1 --branch v0.23.1 --recurse-submodules \
            --shallow-submodules https://github.com/paullouisageneau/libdatachannel.git \
            deps/libdatachannel

          # Pin libjuice to the exact version expected by the PS4 patch.
          rm -rf deps/libdatachannel/deps/libjuice
          git clone --depth 1 --branch v1.6.1 \
            https://github.com/paullouisageneau/libjuice.git \
            deps/libdatachannel/deps/libjuice

          rm -rf deps/ffmpeg
          git clone --depth 1 --branch n7.1.2 \
            https://github.com/FFmpeg/FFmpeg.git deps/ffmpeg

          test -f deps/mbedtls/CMakeLists.txt
          test -f deps/mbedtls/framework/CMakeLists.txt
          test -f deps/libdatachannel/CMakeLists.txt
          test -f deps/libdatachannel/deps/libjuice/CMakeLists.txt
          test -f deps/libdatachannel/deps/usrsctp/usrsctp.h
          test -f deps/ffmpeg/configure

          echo "Dependency versions:"
          git -C deps/mbedtls describe --tags --always
          git -C deps/libdatachannel describe --tags --always
          git -C deps/libdatachannel/deps/libjuice describe --tags --always
          git -C deps/ffmpeg describe --tags --always

      - name: Install OpenOrbis PS4 toolchain
        shell: bash
        run: |
          set -euxo pipefail
          bash tools/ps4/fetch-toolchain.sh "$GITHUB_WORKSPACE/ps4-toolchain" 18
          test -f ps4-toolchain/link.x
          test -f ps4-toolchain/lib/crt1.o
          test -x ps4-toolchain/bin/linux/create-fself
          test -x ps4-toolchain/bin/linux/create-gp4
          echo "$GITHUB_WORKSPACE/ps4-toolchain/bin/linux" >> "$GITHUB_PATH"
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/ps4-toolchain" >> "$GITHUB_ENV"

      - name: Configure optimized PS4 build
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build-ps4 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ps4.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DOO_PS4_TOOLCHAIN="$GITHUB_WORKSPACE/ps4-toolchain"

      - name: Compile PS4 application
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-ps4 --parallel 2
          test -s build-ps4/xcloud_ps4.elf
          file build-ps4/xcloud_ps4.elf

      - name: Create and verify installable PKG
        shell: bash
        env:
          XC_PS4_TITLE: Nawaf Cloud Gaming
          XC_PS4_TITLE_ID: PSBX00001
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
        run: |
          set -euxo pipefail
          version="${{ steps.version.outputs.value }}"
          XC_PS4_VERSION="$version" \
            bash tools/ps4/package.sh build-ps4 build-ps4/pkg

          pkg="build-ps4/pkg/Nawaf Cloud Gaming - PS4.pkg"
          test -s "$pkg"
          file "$pkg"
          sha256sum "$pkg" | tee build-ps4/pkg/SHA256SUMS.txt
          ls -lh "$pkg"

      - name: Upload PS4 PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nawaf-Cloud-Gaming-PS4-v${{ steps.version.outputs.value }}
          path: |
            build-ps4/pkg/Nawaf Cloud Gaming - PS4.pkg
            build-ps4/pkg/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach PKG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          tag="$GITHUB_REF_NAME"

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "Nawaf Cloud Gaming $tag" \
              --notes "Automated PS4 PKG build."

          gh release upload "$tag" \
            "build-ps4/pkg/Nawaf Cloud Gaming - PS4.pkg" \
            "build-ps4/pkg/SHA256SUMS.txt" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
            
